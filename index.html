<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topple History</title>
<meta name="description" content="Topple History: animated true stories where one tiny thing toppled history.">
<link rel="icon" href="trip_logo.png">
<style>
  :root { --cream: #f6ead4; --ink: #241726; --brick: #c8553d; --muted: #5a4a55; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); font: 18px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px 64px; text-align: center; }
  img { width: 160px; height: 160px; border-radius: 50%; }
  h1 { font: 900 2.4rem/1.1 "Arial Black", "Segoe UI Black", system-ui, sans-serif; margin: 24px 0 8px; letter-spacing: 0.01em; }
  .tag { color: var(--brick); font-weight: 700; margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 32px 0; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a { color: var(--ink); }
  ul a { display: inline-block; padding: 10px 18px; border: 2px solid var(--ink); border-radius: 999px; text-decoration: none; font-weight: 700; }
  ul a:hover, ul a:focus-visible { background: var(--ink); color: var(--cream); }
  footer { color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <img src="trip_logo.png" alt="Trip, a smug cartoon pebble, the Topple History mascot">
  <h1>Topple History</h1>
  <p class="tag">Tiny causes. Huge history.</p>
  <p>Animated true stories where one tiny thing toppled history. Every story is researched, and every joke is a real fact.</p>
  <ul>
    <li><a href="https://www.youtube.com/@topple.history">YouTube</a></li>
    <li><a href="https://www.tiktok.com/@topple.history">TikTok</a></li>
    <li><a href="https://www.instagram.com/topple.history/">Instagram</a></li>
  </ul>
  <footer><a href="privacy.html">Privacy policy</a></footer>
</main>
</body>
</html>
